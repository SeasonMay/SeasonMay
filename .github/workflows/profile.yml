name: Refresh profile
on:
  workflow_dispatch:
  schedule:
    - cron: '23 2 * * *'
  push:
    paths:
      - 'tools/profile.py'
      - '.github/workflows/profile.yml'
permissions:
  contents: write
concurrency:
  group: profile-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Render public statistics
        run: python tools/profile.py
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Animate contribution calendar
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b
        with:
          github_user_name: SeasonMay
          outputs: |
            profile/snake.svg
            profile/snake-dark.svg?palette=github-dark
      - name: Save generated assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add profile/
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh profile visuals"
            git push
          fi
